<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Audit Test Suite - Pixel Papa Musique</title>
</head>
<body>
  <h1>Audit Test Suite</h1>
  <div id="results"></div>
  <iframe id="appFrame" src="./index.html" style="width:800px;height:600px;"></iframe>

  <script>
    const resEl = document.getElementById('results');
    const tests = [];
    let passCount = 0;
    let failCount = 0;

    function assert(desc, condition, details = '') {
      if (condition) {
        passCount++;
        tests.push(`<div style="color:green">✅ PASS: ${desc}</div>`);
      } else {
        failCount++;
        tests.push(`<div style="color:red">❌ FAIL: ${desc} ${details ? '(' + details + ')' : ''}</div>`);
      }
    }

    const frame = document.getElementById('appFrame');
    
    // Check if frame finishes loading
    frame.addEventListener('load', () => {
      setTimeout(() => {
        try {
          const win = frame.contentWindow;
          const doc = win.document;

          assert("Iframe window accessible", !!win);
          assert("Document title correct", doc.title.includes("Pixel Papa"));
          if(win.__err){
            tests.push(`<div style="color:red">INDEX SCRIPT ERROR: line ${win.__err.l}: ${win.__err.m}</div>`);
          }
          
          let state = win.state;
          if(!state && win.eval){
            try { state = win.eval("typeof state !== 'undefined' ? state : null"); }catch(e){}
          }
          
          assert("State Proxy accessible", !!state);
          if(!state){
            tests.push(`<div style="color:orange">DEBUG: win properties count = ${Object.keys(win).length}</div>`);
            resEl.innerHTML = tests.join("\n");
            return;
          }

          // 1. Audit State Defaults
          assert("State.cadenceStoryboard default is dynamique", state.cadenceStoryboard === 'dynamique');
          assert("State.eclairageCinema default is neon", state.eclairageCinema === 'neon');
          assert("State.grainFilm default is subtil", state.grainFilm === 'subtil');
          assert("State.colorGrade default is neutral", state.colorGrade === 'neutral');
          assert("State.resolutionVideo default is 1080p", state.resolutionVideo === '1080p');
          assert("State.bitrateVideo default is 10000000", state.bitrateVideo === 10000000);
          assert("State.fpsVideo default is 60", state.fpsVideo === 60);

          // 2. Audit DOM UI Controls
          assert("selCadenceStoryboard exists", !!doc.getElementById('selCadenceStoryboard'));
          assert("selEclairageCinema exists", !!doc.getElementById('selEclairageCinema'));
          assert("selGrainFilm exists", !!doc.getElementById('selGrainFilm'));
          assert("selColorGrade exists", !!doc.getElementById('selColorGrade'));
          assert("selResolutionVideo exists", !!doc.getElementById('selResolutionVideo'));
          assert("selBitrateVideo exists", !!doc.getElementById('selBitrateVideo'));
          assert("selFpsVideo exists", !!doc.getElementById('selFpsVideo'));
          assert("canvasApercu exists", !!doc.getElementById('canvasApercu'));
          assert("canvasExport exists", !!doc.getElementById('canvasExport'));
          assert("btnExportVideo exists", !!doc.getElementById('btnExportVideo'));
          assert("btnPlayApercu exists", !!doc.getElementById('btnPlayApercu'));

          // 3. Audit ParseParoles & Cadence
          const testLyrics = "[Intro]\nHello world\n[Couplet 1]\nLigne un\nLigne deux\nLigne trois\nLigne quatre\n[Refrain]\nChantons le refrain\nEnsemble ce soir";
          const parseParoles = win.parseParoles || win.eval("parseParoles");
          const parsed = parseParoles(testLyrics);
          assert("parseParoles parsed 10 items", parsed.length === 10);
          state.lines = parsed;

          const construireBlocsSections = win.construireBlocsSections || win.eval("construireBlocsSections");
          
          // Test Standard Cadence
          state.cadenceStoryboard = 'standard';
          const blocksStandard = construireBlocsSections();
          assert("Standard cadence creates 3 blocks (Intro, Couplet 1, Refrain)", blocksStandard.length === 3);

          // Test Dynamique Cadence
          state.cadenceStoryboard = 'dynamique';
          const blocksDyn = construireBlocsSections();
          assert("Dynamique cadence splits Couplet 1 (4 lines) into 2 parts", blocksDyn.length === 4, `Got ${blocksDyn.length}`);

          // Test Rapide Cadence
          state.cadenceStoryboard = 'rapide';
          const blocksRapide = construireBlocsSections();
          assert("Rapide cadence splits into 2-line chunks", blocksRapide.length >= 4, `Got ${blocksRapide.length}`);

          // 4. Audit Cinema Directives & Framing
          const CADRAGES_REALISATEUR = win.CADRAGES_REALISATEUR;
          const STYLES_ECLAIRAGE = win.STYLES_ECLAIRAGE;
          const ANGLES_CAMERA_SCENE = win.ANGLES_CAMERA_SCENE;
          const getDirectivesCinema = win.getDirectivesCinema;

          assert("CADRAGES_REALISATEUR has 7 frames", CADRAGES_REALISATEUR && CADRAGES_REALISATEUR.length === 7);
          assert("ANGLES_CAMERA_SCENE has 7 angles", ANGLES_CAMERA_SCENE && Object.keys(ANGLES_CAMERA_SCENE).length === 7);
          assert("STYLES_ECLAIRAGE has 4 styles", STYLES_ECLAIRAGE && Object.keys(STYLES_ECLAIRAGE).length === 4);
          const dir0 = getDirectivesCinema(0);
          const dir1 = getDirectivesCinema(1);
          assert("getDirectivesCinema returns camera & lighting", dir0.includes("Cadrage") && dir0.includes("Éclairage"));
          assert("getDirectivesCinema alternates framing between scenes", dir0 !== dir1);

          // 4b. Audit Character Notes & Per-Scene Angles Prompts
          const characterNotesEl = doc.getElementById('characterNotes');
          assert("characterNotes textarea exists in Character Card", !!characterNotesEl);
          state.characterNotes = "Homme 30 ans, barbe rousse, casquette verte";
          const promptChar = win.promptCharacterSheet("Pixel art 16-bit", state.characterNotes);
          assert("promptCharacterSheet includes character notes", promptChar.includes("Homme 30 ans, barbe rousse"));

          const promptScene = win.promptSceneStoryboard("Refrain", "Le héros saute sur la scène", "Pixel art 16-bit", 0, "dutch");
          assert("promptSceneStoryboard includes strict camera framing uppercase", promptScene.includes("[CADRAGE CINÉMA STRICT :") && promptScene.includes("DUTCH TILT"));
          assert("promptSceneStoryboard includes character notes", promptScene.includes("Homme 30 ans, barbe rousse"));

          // 5. Audit ResolutionExport
          const resolutionExport = win.resolutionExport;
          state.resolutionVideo = '1080p';
          doc.getElementById('formatImage').value = '16:9';
          const res16_9 = resolutionExport();
          assert("1080p 16:9 is 1920x1080", res16_9.w === 1920 && res16_9.h === 1080);

          doc.getElementById('formatImage').value = '9:16';
          const res9_16 = resolutionExport();
          assert("1080p 9:16 is 1080x1920", res9_16.w === 1080 && res9_16.h === 1920);

          doc.getElementById('formatImage').value = '1:1';
          const res1_1 = resolutionExport();
          assert("1080p 1:1 is 1080x1080", res1_1.w === 1080 && res1_1.h === 1080);

          state.resolutionVideo = '720p';
          doc.getElementById('formatImage').value = '16:9';
          const res720 = resolutionExport();
          assert("720p 16:9 is 1280x720", res720.w === 1280 && res720.h === 720);

          // 6. Audit Compositing (Grain, ColorGrade & Camera 2.5D Motion)
          const getGrainPattern = win.getGrainPattern;
          const dessinerGrainFilm = win.dessinerGrainFilm;
          const appliquerColorGrade = win.appliquerColorGrade;
          const dessinerImageAnimee25D = win.dessinerImageAnimee25D || win.eval("dessinerImageAnimee25D");
          const fenetreSectionActuelle = win.fenetreSectionActuelle || win.eval("fenetreSectionActuelle");

          const pat = getGrainPattern();
          assert("getGrainPattern returns CanvasPattern", !!pat);
          const dummyCvs = doc.createElement('canvas');
          dummyCvs.width = 300; dummyCvs.height = 200;
          const dummyCtx = dummyCvs.getContext('2d');
          
          state.grainFilm = 'subtil';
          dessinerGrainFilm(dummyCtx, 300, 200);
          assert("dessinerGrainFilm executes without throwing", true);

          ['teal_orange', 'golden', 'cyber', 'bw'].forEach(mode => {
            state.colorGrade = mode;
            appliquerColorGrade(dummyCtx, 300, 200);
          });
          assert("appliquerColorGrade all 4 modes execute without throwing", true);

          // Test Camera 2.5D Styles & Execution
          assert("selCameraIntensity exists", !!doc.getElementById('selCameraIntensity'));
          state.cameraIntensity = 'dynamique';
          assert("State.cameraIntensity default is dynamique", state.cameraIntensity === 'dynamique');

          // Create dummy test image
          const testImg = new win.Image();
          testImg.src = "data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7";
          ['auto', 'cinematic', 'punch', 'pullout', 'dutch', 'handheld'].forEach(cStyle => {
            state.cameraStyle = cStyle;
            dessinerImageAnimee25D(dummyCtx, dummyCvs, testImg, 0.5, 0, 1.0, 1.25, 0.5, 'wide');
          });
          assert("dessinerImageAnimee25D all camera styles execute without throwing", true);

          // 7. Audit Subtitle wrapping & Canvas Render
          const decouperTexteCanvas = win.decouperTexteCanvas || win.eval("decouperTexteCanvas");
          const linesWrapped = decouperTexteCanvas(dummyCtx, "Ceci est une longue ligne de test pour vérifier le découpage dynamique du texte sur le canvas", 150);
          assert("decouperTexteCanvas wraps text into multiple lines", linesWrapped.length > 1);

          // 7b. Audit Typography & Lyrics Styling Engine (v2.5)
          const FONTS_LYRICS = win.FONTS_LYRICS;
          assert("FONTS_LYRICS contains 6 font stacks", FONTS_LYRICS && Object.keys(FONTS_LYRICS).length === 6);
          assert("selFontLyrics exists", !!doc.getElementById('selFontLyrics'));
          assert("selStyleLyrics exists", !!doc.getElementById('selStyleLyrics'));
          assert("selAnimLyrics exists", !!doc.getElementById('selAnimLyrics'));
          assert("selTransitionStyle exists", !!doc.getElementById('selTransitionStyle'));
          assert("chkCinemascope exists", !!doc.getElementById('chkCinemascope'));
          assert("chkRgbSplit exists", !!doc.getElementById('chkRgbSplit'));

          assert("State.fontLyrics default is montserrat", state.fontLyrics === 'montserrat');
          assert("State.styleLyrics default is capcut_yellow", state.styleLyrics === 'capcut_yellow');
          assert("State.animLyrics default is pop", state.animLyrics === 'pop');
          assert("State.transitionStyle default is smooth", state.transitionStyle === 'smooth');

          const drawRoundedRect = win.drawRoundedRect;
          assert("drawRoundedRect function exists", typeof drawRoundedRect === 'function');
          drawRoundedRect(dummyCtx, 10, 10, 50, 30, 8);
          assert("drawRoundedRect executes without throwing", true);

          const dessinerCinemascope = win.dessinerCinemascope;
          const dessinerRgbSplit = win.dessinerRgbSplit;
          const dessinerSousTitreExport = win.dessinerSousTitreExport;
          assert("dessinerCinemascope function exists", typeof dessinerCinemascope === 'function');
          assert("dessinerRgbSplit function exists", typeof dessinerRgbSplit === 'function');
          assert("dessinerSousTitreExport function exists", typeof dessinerSousTitreExport === 'function');

          state.cinemascope = true;
          dessinerCinemascope(dummyCtx, 300, 200);
          state.cinemascope = false;

          state.rgbSplit = true;
          dessinerRgbSplit(dummyCtx, 300, 200, 0.85);

          // Test all 7 visual lyric styles
          state.playingIndex = 1;
          ['capcut_yellow', 'tiktok_white', 'cyber_glow', 'pill_box', 'cinema_minimal', 'karaoke_highlight', 'arcade_box'].forEach(s => {
            state.styleLyrics = s;
            dessinerSousTitreExport(dummyCtx, dummyCvs, 2.5, 0.4);
          });
          assert("dessinerSousTitreExport all 7 visual styles execute without throwing", true);

          // Test all 5 lyric animations
          ['pop', 'slide', 'karaoke', 'pulse', 'static'].forEach(a => {
            state.animLyrics = a;
            dessinerSousTitreExport(dummyCtx, dummyCvs, 2.5, 0.6);
          });
          assert("dessinerSousTitreExport all 5 animations execute without throwing", true);

          // Test all 5 scene transitions in dessinerFrameComposite
          const dessinerFrameComposite = win.dessinerFrameComposite;
          state.storyboard = [
            { label: 'Scene 1', dataUrl: testImg.src, img: testImg },
            { label: 'Scene 2', dataUrl: testImg.src, img: testImg }
          ];
          ['smooth', 'whip', 'zoom', 'flash', 'glitch'].forEach(tr => {
            state.transitionStyle = tr;
            dessinerFrameComposite(dummyCtx, dummyCvs);
          });
          assert("dessinerFrameComposite all 5 transition styles execute without throwing", true);

          // 8. Audit Subtitle Export Formats
          const buildSRT = win.buildSRT;
          const buildVTT = win.buildVTT;
          const buildAnimJSON = win.buildAnimJSON;
          assert("buildSRT function exists", typeof buildSRT === 'function');
          assert("buildVTT function exists", typeof buildVTT === 'function');
          assert("buildAnimJSON function exists", typeof buildAnimJSON === 'function');

          // 9. Test pre-calage AI scenario (partial timings with null end)
          state.lines[1].start = 2.45;
          try {
            const jsonStr = buildAnimJSON();
            assert("buildAnimJSON safely handles partial timing without throwing toFixed", jsonStr.includes("2.45"));
          } catch(err) {
            assert("buildAnimJSON safely handles partial timing without throwing toFixed", false, err.message);
          }

          // 10. Audit Narrative Storytelling & Scenario Directives (v2.6)
          assert("selApprocheNarrative exists", !!doc.getElementById('selApprocheNarrative'));
          assert("scenarioNotes textarea exists", !!doc.getElementById('scenarioNotes'));
          assert("State.approcheNarrative default is parallele", state.approcheNarrative === 'parallele');
          assert("State.scenarioNotes default is empty string", state.scenarioNotes === '');

          const schema = win.STORYBOARD_PLAN_SCHEMA;
          assert("STORYBOARD_PLAN_SCHEMA exists", !!schema && !!schema.items && !!schema.items.properties);
          assert("STORYBOARD_PLAN_SCHEMA includes role_dramatique", !!schema.items.properties.role_dramatique);
          assert("STORYBOARD_PLAN_SCHEMA requires role_dramatique", schema.items.required.includes('role_dramatique'));

          const promptPlan = win.promptPlanStoryboard;
          assert("promptPlanStoryboard function exists", typeof promptPlan === 'function');

          const dummyBlocks = [{ nom: "Couplet 1", nomBase: "Couplet 1", lignes: [{ text: "Dans la rue sombre" }], debut: 0, fin: 5 }];
          const pParallele = promptPlan("Test Song", dummyBlocks, "Style 3D", true, "parallele", "Il construit un robot");
          assert("promptPlanStoryboard with parallele includes parallel story instructions", pParallele.includes("HISTOIRE PARALLÈLE") || pParallele.includes("MÉTAPHORE"));
          assert("promptPlanStoryboard includes scenario directive", pParallele.includes("Il construit un robot"));
          assert("promptPlanStoryboard includes role dramatique instructions", pParallele.includes("ARC DRAMATIQUE STRUCTURÉ"));

          const pDirect = promptPlan("Test Song", dummyBlocks, "Style 3D", false, "direct", "");
          assert("promptPlanStoryboard with direct includes linear lyrics story", pDirect.includes("RÉCIT DIRECT") || pDirect.includes("PAROLES"));

          const pQuete = promptPlan("Test Song", dummyBlocks, "Style 3D", false, "quete", "");
          assert("promptPlanStoryboard with quete includes hero journey", pQuete.includes("QUÊTE HÉROÏQUE") || pQuete.includes("TRANSFORMATION"));

          const pClip = promptPlan("Test Song", dummyBlocks, "Style 3D", false, "clip", "");
          assert("promptPlanStoryboard with clip includes stage performance", pClip.includes("PERFORMANCE SCÉNIQUE") || pClip.includes("CLIP"));

          // 11. Audit Viral Video Studio, CRT & Overlays (v2.7)
          assert("selDureeTeaser exists", !!doc.getElementById('selDureeTeaser'));
          assert("selFormatTeaser exists", !!doc.getElementById('selFormatTeaser'));
          assert("selPresetPOV exists", !!doc.getElementById('selPresetPOV'));
          assert("bandeauPOV textarea exists", !!doc.getElementById('bandeauPOV'));
          assert("chkAfficherPOV exists", !!doc.getElementById('chkAfficherPOV'));
          assert("btnMasquerPOV exists", !!doc.getElementById('btnMasquerPOV'));
          assert("selPresetPOVApercu exists", !!doc.getElementById('selPresetPOVApercu'));
          assert("txtPOVApercu exists", !!doc.getElementById('txtPOVApercu'));
          assert("btnMasquerPOVHook exists", !!doc.getElementById('btnMasquerPOVHook'));
          assert("btnExportTeaser exists", !!doc.getElementById('btnExportTeaser'));
          assert("btnDownloadAudioSnippet exists", !!doc.getElementById('btnDownloadAudioSnippet'));
          assert("canvasTeaserExport exists", !!doc.getElementById('canvasTeaserExport'));
          assert("chkCrtScanlines exists", !!doc.getElementById('chkCrtScanlines'));
          assert("selRetroOverlay exists", !!doc.getElementById('selRetroOverlay'));
          assert("chkPatternInterrupt exists", !!doc.getElementById('chkPatternInterrupt'));

          assert("State.crtScanlines default is false", state.crtScanlines === false);
          assert("State.retroOverlay default is none", state.retroOverlay === 'none');
          assert("State.patternInterrupt default is false", state.patternInterrupt === false);
          assert("State.afficherPOV default is false", state.afficherPOV === false);
          assert("State.dureeTeaser default is 15", state.dureeTeaser === '15');
          assert("State.formatTeaser default is 9:16", state.formatTeaser === '9:16');
          assert("State.bandeauPOV contains preset text", state.bandeauPOV && state.bandeauPOV.includes("1999"));

          const dessinerCrtScanlines = win.dessinerCrtScanlines;
          const dessinerRetroOverlay = win.dessinerRetroOverlay;
          const dessinerBandeauPOV = win.dessinerBandeauPOV;
          const dessinerPatternInterrupt = win.dessinerPatternInterrupt;
          const synchroniserPOV = win.synchroniserPOV;
          const audioBufferToWav = win.audioBufferToWav;

          assert("dessinerCrtScanlines function exists", typeof dessinerCrtScanlines === 'function');
          assert("dessinerRetroOverlay function exists", typeof dessinerRetroOverlay === 'function');
          assert("dessinerBandeauPOV function exists", typeof dessinerBandeauPOV === 'function');
          assert("dessinerPatternInterrupt function exists", typeof dessinerPatternInterrupt === 'function');
          assert("synchroniserPOV function exists", typeof synchroniserPOV === 'function');
          assert("audioBufferToWav function exists", typeof audioBufferToWav === 'function');

          // Test execution of new canvas functions without throwing
          state.crtScanlines = true;
          dessinerCrtScanlines(dummyCtx, 300, 200);
          state.crtScanlines = false;

          ['none', 'rec', 'arcade', 'pixelpapa'].forEach(mode => {
            state.retroOverlay = mode;
            dessinerRetroOverlay(dummyCtx, 300, 200, 5.2);
          });
          state.retroOverlay = 'none';

          // Test POV rendering when enabled and disabled
          state.afficherPOV = false;
          dessinerBandeauPOV(dummyCtx, 300, 200);
          state.afficherPOV = true;
          dessinerBandeauPOV(dummyCtx, 300, 200);
          state.afficherPOV = false;

          // Test synchroniserPOV helper
          synchroniserPOV(true, "Mon test POV viral", "custom");
          assert("synchroniserPOV enables state.afficherPOV", state.afficherPOV === true);
          assert("synchroniserPOV updates state.bandeauPOV", state.bandeauPOV === "Mon test POV viral");
          assert("synchroniserPOV updates chkAfficherPOV checkbox", doc.getElementById('chkAfficherPOV').checked === true);
          synchroniserPOV(false, null, 'none');
          assert("synchroniserPOV can disable POV", state.afficherPOV === false);
          assert("synchroniserPOV unchecks chkAfficherPOV checkbox", doc.getElementById('chkAfficherPOV').checked === false);

          state.patternInterrupt = true;
          dessinerPatternInterrupt(dummyCtx, 300, 200, 0.5, 0.5);
          state.patternInterrupt = false;

          assert("All new viral rendering functions execute without throwing", true);

          // Test resolutionExport with custom format
          state.resolutionVideo = '1080p';
          const resTeaser916 = win.resolutionExport('9:16');
          assert("resolutionExport('9:16') returns 1080x1920", resTeaser916.w === 1080 && resTeaser916.h === 1920);

          const resTeaser11 = win.resolutionExport('1:1');
          assert("resolutionExport('1:1') returns 1080x1080", resTeaser11.w === 1080 && resTeaser11.h === 1080);

          // ═══════════════════ TESTS v2.8 : MULTI-PERSONNAGES & SCÉNARISTE / PRODUCTEUR ═══════════════════
          // 1. DOM Multi-Personnages
          assert("btnAddCharacter button exists", !!doc.getElementById('btnAddCharacter'));
          assert("charactersContainer exists", !!doc.getElementById('charactersContainer'));
          assert("cardChar_1 exists", !!doc.getElementById('cardChar_1'));
          assert("charName_1 exists", !!doc.getElementById('charName_1'));
          assert("charRole_1 exists", !!doc.getElementById('charRole_1'));

          // 2. État Réactif & Proxy des Personnages
          assert("state.characters is an array", Array.isArray(state.characters));
          assert("state.characters has at least 1 character", state.characters.length >= 1);
          assert("Character 1 has default name Héros", state.characters[0].nom === 'Héros');
          assert("Character 1 has default role Protagoniste", state.characters[0].role === 'Protagoniste');

          // Proxy getter/setter sync
          state.characterNotes = "Test notes héros";
          assert("state.characterNotes updates state.characters[0].notes", state.characters[0].notes === "Test notes héros");

          // 3. Ajout dynamique d'un 2ème personnage
          const ajouterNouveauPersonnage = win.ajouterNouveauPersonnage;
          assert("ajouterNouveauPersonnage function exists", typeof ajouterNouveauPersonnage === 'function');
          const initialCount = state.characters.length;
          const p2 = ajouterNouveauPersonnage({ nom: "Le Rival", role: "Rival", notes: "Regard perçant, blouson sombre et gants d'arcade" });
          assert("state.characters length increased by 1", state.characters.length === initialCount + 1);
          assert("Second character has name 'Le Rival'", state.characters[initialCount].nom === "Le Rival");
          assert("Second character card rendered in DOM", !!doc.getElementById(`cardChar_${p2.id}`));

          // 4. Schéma Storyboard v2.8
          assert("STORYBOARD_PLAN_SCHEMA includes personnages_presents", !!win.STORYBOARD_PLAN_SCHEMA.items.properties.personnages_presents);
          assert("STORYBOARD_PLAN_SCHEMA requires personnages_presents", win.STORYBOARD_PLAN_SCHEMA.items.required.includes("personnages_presents"));
          assert("STORYBOARD_PLAN_SCHEMA includes dynamique_personnages", !!win.STORYBOARD_PLAN_SCHEMA.items.properties.dynamique_personnages);

          // 5. Prompt Plan Storyboard (Vision Scénariste & Producteur)
          const testBlocs = win.construireBlocsSections();
          const pScreenwriter = win.promptPlanStoryboard("Chanson Test", testBlocs, "Style Pixel Art", state.characters, "parallele", "Directive test");
          assert("promptPlanStoryboard includes CASTING DES PERSONNAGES", pScreenwriter.includes("CASTING DES PERSONNAGES DISPONIBLES"));
          assert("promptPlanStoryboard includes character 'Le Rival'", pScreenwriter.includes("Le Rival"));
          assert("promptPlanStoryboard includes PRODUCTEUR EXÉCUTIF", pScreenwriter.includes("PRODUCTEUR EXÉCUTIF"));
          assert("promptPlanStoryboard includes MONEY SHOT", pScreenwriter.includes("MONEY SHOT"));
          assert("promptPlanStoryboard includes SCÉNARISTE", pScreenwriter.includes("SCÉNARISTE"));
          assert("promptPlanStoryboard includes 5 BEATS structure", pScreenwriter.includes("5 BEATS"));

          // 6. Prompt Scène Multi-Personnages
          const pSceneMulti = win.promptSceneStoryboard("Refrain", "Duel épique au sommet", "Style Arcade", 2, "wide", ["Héros", "Le Rival"]);
          assert("promptSceneStoryboard includes multi-character header", pSceneMulti.includes("PERSONNAGES RÉUNIS DANS CETTE SCÈNE (2 PERSONNAGES ENSEMBLE)"));
          assert("promptSceneStoryboard includes blocking & contrast directives", pSceneMulti.includes("DIRECTIVE DE MISE EN SCÈNE MULTI-PERSONNAGES (BLOCKING & CONTRASTE)"));
          assert("promptSceneStoryboard includes both characters names", pSceneMulti.includes("Héros") && pSceneMulti.includes("Le Rival"));

          // 7. Prompt Scène Personnage Solo
          const pSceneSolo = win.promptSceneStoryboard("Couplet", "Préparation en solo", "Style Arcade", 1, "closeup", ["Le Rival"]);
          assert("promptSceneStoryboard handles single targeted character", pSceneSolo.includes('PERSONNAGE EN SCÈNE : "Le Rival"'));

          // 8. buildImageParts avec personnages ciblés
          const buildImageParts = win.buildImageParts;
          assert("buildImageParts function exists", typeof buildImageParts === 'function');
          const partsScene = buildImageParts("Prompt de base", [], ["Le Rival"]);
          assert("buildImageParts returns array with text part", Array.isArray(partsScene) && partsScene.length > 0);

          // 13. Audit Animation Hub & External NLE / AI Export (v2.10)
          assert("btnTelechargerPackAnim exists", !!doc.getElementById('btnTelechargerPackAnim'));
          assert("btnTelechargerIllustrationsAnim exists", !!doc.getElementById('btnTelechargerIllustrationsAnim'));
          assert("btnTelechargerSRTAnim exists", !!doc.getElementById('btnTelechargerSRTAnim'));
          assert("btnTelechargerScenesSRTAnim exists", !!doc.getElementById('btnTelechargerScenesSRTAnim'));
          assert("btnTelechargerCSVAnim exists", !!doc.getElementById('btnTelechargerCSVAnim'));
          assert("btnAllerVisuels exists", !!doc.getElementById('btnAllerVisuels'));
          assert("btnTelechargerPackVisuels exists", !!doc.getElementById('btnTelechargerPackVisuels'));
          assert("animHubStatus exists", !!doc.getElementById('animHubStatus'));
          assert("tableTimelineAnim exists", !!doc.getElementById('tableTimelineAnim'));
          assert("tbodyTimelineAnim exists", !!doc.getElementById('tbodyTimelineAnim'));

          const calculerTimelineScenes = win.calculerTimelineScenes;
          const fmtTimecodeFichier = win.fmtTimecodeFichier;
          const nomFichierIllustration = win.nomFichierIllustration;
          const buildScenesSRT = win.buildScenesSRT;
          const buildScenesCSV = win.buildScenesCSV;
          const telechargerIllustrationsCalees = win.telechargerIllustrationsCalees;
          const telechargerPackAnimationExterne = win.telechargerPackAnimationExterne;
          const updateAnimationHub = win.updateAnimationHub;

          assert("calculerTimelineScenes function exists", typeof calculerTimelineScenes === 'function');
          assert("fmtTimecodeFichier function exists", typeof fmtTimecodeFichier === 'function');
          assert("nomFichierIllustration function exists", typeof nomFichierIllustration === 'function');
          assert("buildScenesSRT function exists", typeof buildScenesSRT === 'function');
          assert("buildScenesCSV function exists", typeof buildScenesCSV === 'function');
          assert("telechargerIllustrationsCalees function exists", typeof telechargerIllustrationsCalees === 'function');
          assert("telechargerPackAnimationExterne function exists", typeof telechargerPackAnimationExterne === 'function');
          assert("updateAnimationHub function exists", typeof updateAnimationHub === 'function');

          // Test fmtTimecodeFichier
          assert("fmtTimecodeFichier(0) is 00m00s", fmtTimecodeFichier(0) === "00m00s");
          assert("fmtTimecodeFichier(75) is 01m15s", fmtTimecodeFichier(75) === "01m15s");

          // Test nomFichierIllustration
          const testSceneObj = { index: 1, debut: 0, fin: 4.5, nom: "Intro Synthwave" };
          const fname = nomFichierIllustration(testSceneObj);
          assert("nomFichierIllustration formats properly with timing and slug", fname.startsWith("01_00m00s-00m04s_intro-synthwave"));

          // Test timeline calculation
          const timeline = calculerTimelineScenes();
          assert("calculerTimelineScenes returns array of scenes", Array.isArray(timeline) && timeline.length > 0);
          assert("calculerTimelineScenes first scene starts at 0", timeline[0].debut === 0);
          assert("calculerTimelineScenes scenes have valid durations and frame counts", timeline[0].duree > 0 && timeline[0].frames30 > 0);

          // Test buildScenesSRT
          const scenesSRT = buildScenesSRT();
          assert("buildScenesSRT returns valid SRT formatted string", typeof scenesSRT === 'string' && scenesSRT.includes("-->"));

          // Test buildScenesCSV
          const scenesCSV = buildScenesCSV();
          assert("buildScenesCSV returns CSV header and rows", typeof scenesCSV === 'string' && scenesCSV.includes("Index;Nom Scene") && scenesCSV.includes("Frames 30fps"));

          // Test updateAnimationHub renders rows into DOM
          updateAnimationHub();
          const tbodyEl = doc.getElementById('tbodyTimelineAnim');
          assert("updateAnimationHub populates tbodyTimelineAnim", tbodyEl && tbodyEl.children.length > 0);

          // Summary
          const summaryText = `AUDIT_FINISHED: PASS=${passCount}, FAIL=${failCount}`;
          tests.push(`<h2>${summaryText}</h2>`);
          resEl.innerHTML = tests.join("\n");
          console.log(summaryText);
        } catch(e) {
          failCount++;
          tests.push(`<div style="color:red">FATAL ERROR: ${e.message}</div>`);
          resEl.innerHTML = tests.join("\n");
          console.error("FATAL AUDIT ERROR:", e);
        }
      }, 500);
    });
  </script>
